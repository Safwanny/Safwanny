<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Robotics, Autonomy, Edge AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#a371f7;#58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#3fb950;#a371f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="900" begin="0.2s" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect width="900" height="200" rx="16" fill="url(#dots)"/>

  <circle cx="830" cy="60" r="5" fill="#58a6ff"/>
  <circle cx="830" cy="60" r="10" fill="none" stroke="#58a6ff" stroke-width="2">
    <animate attributeName="r" values="10;50" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)" clip-path="url(#reveal)">Robotics · Autonomy · Edge AI</text>

  <text x="60" y="142" font-family="Consolas, Menlo, monospace" font-size="18" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="1s" fill="freeze"/>
    simulation-first · ROS 2 · from CAD to hardware
  </text>
</svg>
