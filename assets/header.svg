<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Robotics, Autonomy, Edge AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#a371f7;#58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#3fb950;#a371f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="120">
        <animate attributeName="width" from="0" to="900" begin="0.2s" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="120" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect width="900" height="120" rx="14" fill="url(#dots)"/>

  <text x="450" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#accent)" clip-path="url(#reveal)">Robotics · Autonomy · Edge AI</text>
</svg>
